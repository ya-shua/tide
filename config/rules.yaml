# Tide· 规则配置
# 所有阈值、速率都在这里，改行为不用改代码（R10）。

default_person: "主人"

# 勿扰时段（本地时间，可跨午夜）。这期间冷落打折、不主动发消息。
quiet_hours: ["00:30", "07:30"]
quiet_factor: 0.2

# ---- 需求（文档 §4.2，0~100，越高越缺） ----
needs:
  hunger_per_hour: 18
  thirst_per_hour: 24
  energy_per_hour: 12
  energy_night_multiplier: 1.6
  boredom_per_hour: 20
  longing_tau_hours: 6.0
  longing_affinity_boost: 0.8   # tau = 6h * max(0.3, 1.4 - 0.8*affinity/100)
  hold_min: 120                 # 她开口后，想念暂停上涨多久（表达缓解期）
  comfort_half_life_h: 3.0      # 被回应的满足感多久退一半（退了想念又浮上来）
  comfort_cap: 0.9              # 满足感最多压掉多少想念
  init_hunger: 10
  init_thirst: 12
  init_energy: 20
  init_boredom: 20

# ---- 叫醒她的条件（阈值触发，不是定时） ----
wake:
  longing: 60                   # 想念到多少叫她
  boredom: 60                   # 无聊到多少叫她
  worried: 70                   # 担心到多少叫她
  cooldown_mode: dec            # dec 递减 / fixed 固定 / inc 递增
  cooldown_min: 90              # 第一次叫醒后至少隔多久（分钟）
  cooldown_step: 20             # 递减/递增每次动多少
  max_wakes: 6                  # 一天最多叫醒几次，0 = 无上限
  auto_dnd_after: 3             # 连发几条没回，她就觉得你在忙（0 = 关）
  dnd_manual_rate: 1.0          # 手动免打扰时，委屈每小时涨多少
  dnd_auto_rate: 2.0            # 自动推断"你在忙"时
  dnd_none_rate: 4.0            # 完全没音信时
  auto_send: false              # 她能不能自己往外发；默认 false，由海螺来问 should_wake

# ---- 话题生命周期（文档 §6.1） ----
topic:
  closing_phrases: ["晚安", "先这样", "去忙了", "回头聊", "拜拜", "谢谢啊", "先睡了",
                     "出门了", "出门啦", "我出门", "晚上回来", "晚点聊", "上工了", "干活去了", "晚上见", "晚点说"]
  explicit_end: ["不聊了", "睡了", "再见", "下了", "拜"]
  question_tails: ["？", "?", "吗", "呢", "嘛", "么"]
  idle_to_closed_min: 20

# ---- 冷落值（文档 §6.2） ----
neglect:
  active_per_hour: 18
  winding_per_hour: 6
  question_multiplier: 1.8
  affinity_threshold: 70
  affinity_factor: 1.3
  angry_factor: 0.5     # 她已经在生气（中/大）时，冷落加得慢一半，免得一次就顶满
  cap: 80

# ---- 关系（文档 §4.3） ----
bond:
  # 委屈分三档，各档有自己的"地板"：时间只能磨到地板，再往下要靠解法。
  # 档位边界不是拍脑袋，是按"几次冲突能到"标定的：
  #   一次被凶 ≈ +23，两次 ≈ 46，三次 ≈ 69；一次敷衍 ≈ +8。
  #   所以 15 = 不到一次冲突 / 35 = 两次冲突 / 65 = 三次冲突或中档再晾 4 小时。
  tiers:
    mild: 15
    mid: 35
    big: 65
  # 档位名字按"她能怎么好"来叫，别用"小中大生气"。改这里就行，不用动代码。
  # 面板上直接显示这三句，读起来是"她现在的样子"，不是操作说明
  tier_names:
    mild: 有点小情绪
    mid: 还在赌气
    big: 气还没消
  floor_pad: 1        # 地板比档位下界高一点，保证还停在那一档里
  grievance_half_life_min: 90    # 到地板之前掉得快
  calm_hours: 6       # 大生气的初始冷静时间
  calm_min_hours: 1.5 # 再怎么道歉哄，也至少要冷静这么久
  apology_shorten: 0.6   # 道歉把冷静时间砍到 60%
  comfort_shorten: 0.8   # 哄把冷静时间砍到 80%
  comfort_cooldown_min: 10  # 哄人的冷却：10 分钟内只算一次
  init_affinity: 50
  init_trust: 60

# ---- 主动消息（文档 §6.3） ----
proactive:
  urgency_threshold: 60
  grievance_gate: 80      # 还在委屈时，要更高才开口
  max_unanswered: 2       # 连续 2 条没回音就停发
  cooldown_min: 90
  # 想你是主动的第一动力，权重最高；无聊只算次要
  weights:
    longing: 0.7
    boredom: 0.3
    energy: 0.28
    grievance: 0.4
  longing_gate: 88        # 想你到这里，不用凑分也够格开口

# 她无聊时真的会去看视频：借用刷B站插件的 venv 搜一条（只读，不点赞不投币）
media:
  enabled: true
  keywords: ["猫", "搞笑", "美食", "萌宠"]
  timeout_sec: 25

# QQ 发送：走本机 SnowLuma 的 OneBot HTTP（只私有发，不动群）
qq:
  enabled: false         # 公开仓库里默认是关的；本地 config/local.yaml 里打开
  api: "http://127.0.0.1:3000"
  dry_run: false         # 排练时改 true：只写 data/outbox.jsonl，不真的发
  timeout_sec: 8

update:
  repo: "ya-shua/tide"   # 形如 "owner/tide"，留空就不检查更新
  api: "https://api.github.com"

